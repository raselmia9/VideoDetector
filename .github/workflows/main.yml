name: Python DLive Scraper

on:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    # গিটহাবে ফাইল কমিট এবং পুশ করার জন্য এই পারমিশনটি বাধ্যতামূলক
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Python script
        run: |
          python main.py

      - name: Commit and push status.txt to repository root
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add status.txt
          git commit -m "Auto-update status.txt with latest stream links" || echo "No changes to commit"
          git push
