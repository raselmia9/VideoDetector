name: DLive Link Scraper

on:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install

      - name: Install Puppeteer System Dependencies (Crucial for Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Run scraping script
        run: |
          node index.js

      - name: Upload status artifact
        uses: actions/upload-artifact@v4
        with:
          name: streaming-status
          path: status.txt
