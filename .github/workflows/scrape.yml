name: DLive Link Scraper

on:
  workflow_dispatch: # গিটহাব অ্যাকশন্স ট্যাব থেকে ম্যানুয়ালি রান করানোর জন্য
  schedule:
    - cron: '0 */6 * * *' # চাইলে প্রতি ৬ ঘণ্টা পর পর অটো রান করাতে পারেন (ঐচ্ছিক)

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install

      - name: Run scraping script
        run: |
          node index.js

      - name: Upload status artifact
        uses: actions/upload-artifact@v4
        with:
          name: streaming-status
          path: status.txt
